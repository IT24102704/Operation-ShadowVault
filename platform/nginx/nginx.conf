server {
    listen 80;
    server_name _;

    client_max_body_size 64m;

    # Stage 1 synthetic OSINT site.
    location /osint/ {
        alias /srv/shadowvault/osint/;
        index index.html;
        try_files $uri $uri/ /osint/index.html;
    }

    # Read-only evidence delivery area.
    location /evidence/ {
        alias /srv/shadowvault/evidence/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    # VaultDesk web challenge.
    location /vaultdesk/ {
        proxy_pass http://vaultdesk:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ShadowVault custom CTFd theme assets.
    location /shadowvault-theme/ {
        alias /srv/shadowvault/ctfd-theme/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    # CTFd control plane.
    location / {
        proxy_pass http://ctfd:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}